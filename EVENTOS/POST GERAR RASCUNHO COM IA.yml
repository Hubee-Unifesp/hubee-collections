info:
  name: POST GERAR RASCUNHO COM IA
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/events/ai-draft"
  body:
    type: json
    data: |-
      {
        "prompt": "Festa Junina da Engenharia, 3ª edição, no sábado que vem das 20h às 2h no Ginásio da Unifesp, Rua Talim 330, São José dos Campos - SP. Proibido para menores de 18. 1º lote inteira a R$ 30 e meia-entrada, 200 ingressos de cada."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const DRAFT_FIELDS = [
          "name",
          "description",
          "category",
          "ageRating",
          "edition",
          "startDate",
          "endDate",
          "venueSuggestion",
          "suggestedTicketTypes",
        ];
        const CATEGORIES = ["festas", "shows", "palestras", "esportes", "academicos", "outros"];
        const AGE_RATINGS = ["L", "10", "12", "14", "16", "18"];
        const MODALITIES = ["inteira", "meia", "estudante", "vip", "cortesia"];
        const draft = res.getBody();

        test("responde 200", function () {
          expect(res.getStatus(), draft && draft.message).to.equal(200);
        });

        test("devolve exatamente os campos do rascunho", function () {
          expect(draft).to.have.all.keys(DRAFT_FIELDS.concat("missingFields"));
        });

        test("categoria e classificação são nulas ou valores válidos", function () {
          if (draft.category !== null) expect(CATEGORIES).to.include(draft.category);
          if (draft.ageRating !== null) expect(AGE_RATINGS).to.include(draft.ageRating);
        });

        test("datas são nulas ou ISO 8601 com término depois do início", function () {
          ["startDate", "endDate"].forEach(function (field) {
            if (draft[field] !== null) expect(Date.parse(draft[field])).to.not.be.NaN;
          });
          if (draft.startDate !== null && draft.endDate !== null) {
            expect(Date.parse(draft.endDate)).to.be.greaterThan(Date.parse(draft.startDate));
          }
        });

        test("local sugerido tem só name, address, city e state", function () {
          if (draft.venueSuggestion !== null) {
            expect(draft.venueSuggestion).to.have.all.keys("name", "address", "city", "state");
            if (draft.venueSuggestion.state !== null) {
              expect(draft.venueSuggestion.state).to.match(/^[A-Z]{2}$/);
            }
          }
        });

        test("cada lote sugerido tem nome, preço e modalidade válidos", function () {
          expect(draft.suggestedTicketTypes).to.be.an("array");
          draft.suggestedTicketTypes.forEach(function (ticketType) {
            expect(ticketType).to.have.all.keys("batch", "price", "quantity", "modality");
            expect(ticketType.batch).to.be.a("string").that.is.not.empty;
            if (ticketType.price !== null) expect(ticketType.price).to.be.at.least(0);
            if (ticketType.quantity !== null) expect(ticketType.quantity).to.be.at.least(0);
            if (ticketType.modality !== null) expect(MODALITIES).to.include(ticketType.modality);
          });
        });

        test("missingFields lista exatamente os campos vazios", function () {
          const empty = DRAFT_FIELDS.filter(function (field) {
            return field === "suggestedTicketTypes"
              ? draft.suggestedTicketTypes.length === 0
              : draft[field] === null;
          });
          expect(draft.missingFields).to.deep.equal(empty);
        });

        test("descrição completa gera nome, categoria e lotes", function () {
          expect(draft.name).to.be.a("string").that.is.not.empty;
          expect(draft.category).to.equal("festas");
          expect(draft.suggestedTicketTypes).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # POST /events/ai-draft

  Organizador descreve o evento em linguagem natural e recebe um rascunho
  estruturado do evento e dos lotes, gerado com IA (Claude). **Nada é salvo:** o
  rascunho serve para preencher o formulário de criação, e o evento só existe
  depois do POST CRIAR EVENTO.

  **Acesso:** `ADMIN` ou membro aceito de qualquer organização. Cada usuário tem
  um limite de gerações por janela (padrão: 5 por minuto).

  **Corpo**
  - `prompt` (string, até 2000 caracteres, sem espaços nas pontas) — obrigatório

  **Rascunho devolvido**
  - `name`, `description`, `edition` (string ou `null`)
  - `category`: `festas` | `shows` | `palestras` | `esportes` | `academicos` | `outros` | `null`
  - `ageRating`: `L` | `10` | `12` | `14` | `16` | `18` | `null`
  - `startDate`, `endDate` (ISO 8601 com fuso, ou `null`)
  - `venueSuggestion`: `{ name, address, city, state }` ou `null` (nada é criado em LOCAIS)
  - `suggestedTicketTypes[]`: `{ batch, price, quantity, modality }`
  - `missingFields[]`: campos que a IA não conseguiu inferir e precisam de revisão

  **Respostas**

  - `200` rascunho gerado
  - `400` `prompt` ausente, vazio, longo demais ou campo extra no corpo
  - `401` token ausente ou inválido
  - `403` usuário sem organização
  - `422` a IA recusou gerar o rascunho para essa descrição
  - `429` limite de gerações atingido (cabeçalho `Retry-After`)
  - `503` IA indisponível, sem `ANTHROPIC_API_KEY` na API ou resposta inválida

  Em `production` a requisição não altera dados, mas consome tokens pagos e a
  cota do organizador.
