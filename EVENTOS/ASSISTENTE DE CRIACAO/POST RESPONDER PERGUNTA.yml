info:
  name: POST RESPONDER PERGUNTA
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/events/ai-assistant/turn"
  body:
    type: json
    data: |-
      {
        "draft": {
          "name": "Calourada da Engenharia",
          "description": null,
          "category": null,
          "ageRating": null,
          "edition": null,
          "startDate": "2030-12-05",
          "startTime": null,
          "endDate": null,
          "endTime": null,
          "salesStartDate": null,
          "salesStartTime": null,
          "venue": null,
          "ticketTypes": [],
          "skipped": []
        },
        "field": "start",
        "answer": "começa às 21h e vai até as 3h"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const FIELDS = ["name", "start", "end", "venue", "ticketTypes", "salesStart", "category", "ageRating", "description"];
        const body = res.getBody();

        test("devolve rascunho, reply, question, missingRequired e done", function () {
          expect(body).to.have.all.keys("draft", "reply", "question", "missingRequired", "done");
          expect(body.draft).to.include.all.keys("startDate", "startTime", "endDate", "endTime", "venue", "ticketTypes", "skipped");
        });

        test("done só é true sem pergunta e sem obrigatório faltando", function () {
          expect(body.done).to.equal(body.question === null);
          if (body.done) expect(body.missingRequired).to.be.empty;
        });

        test("a pergunta é de um campo conhecido", function () {
          if (body.question !== null) {
            expect(FIELDS).to.include(body.question.field);
            expect(body.question.text).to.be.a("string").that.is.not.empty;
            expect(body.question.skippable).to.be.a("boolean");
          }
        });

        test("responde 200", function () {
          expect(res.getStatus(), body && body.message).to.equal(200);
        });

        test("preenche o horário e mantém o resto do rascunho", function () {
          expect(body.draft.name).to.equal("Calourada da Engenharia");
          expect(body.draft.startDate).to.equal("2030-12-05");
          expect(body.draft.startTime).to.equal("21:00");
        });

        test("término de madrugada cai no dia seguinte", function () {
          expect(body.draft.endDate).to.equal("2030-12-06");
          expect(body.draft.endTime).to.equal("03:00");
        });

        test("segue para o local", function () {
          expect(body.question.field).to.equal("venue");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # POST /events/ai-assistant/turn

  Resposta curta a uma pergunta: o rascunho anterior vai em `draft` e o campo perguntado em `field`. A IA entende "às 21h até as 3h" e o término vai para o dia seguinte.

  **Corpo**
  - `draft` — rascunho devolvido na rodada anterior (ausente na primeira mensagem)
  - `field` — campo da pergunta respondida: `name` | `start` | `end` | `venue` | `ticketTypes` | `salesStart` | `category` | `ageRating` | `description`
  - `answer` — texto livre, até 2000 caracteres (obrigatório quando `skip` não é `true`)
  - `skip` — `true` pula a pergunta de um campo opcional, sem chamar a IA

  **Resposta `200`**
  - `draft` — rascunho atualizado, com dia e horário separados (`startDate` `AAAA-MM-DD` + `startTime` `HH:mm`) e `skipped`
  - `reply` — confirmação curta da IA (`null` quando não houve chamada)
  - `question` — próxima pergunta `{ field, text, skippable }` ou `null`
  - `missingRequired` — obrigatórios ainda incompletos (nome, início, término, local)
  - `done` — `true` só quando não há mais pergunta

  **Erros:** `400` corpo inválido · `401` sem token · `403` sem organização · `429` limite de IA (`Retry-After`) · `503` IA indisponível ou sem `ANTHROPIC_API_KEY`.

  Em `production` a requisição não altera dados, mas as que chamam a IA consomem
  tokens pagos e a cota do organizador.
