info:
  name: GET RESUMO DOS PROXIMOS EVENTOS
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/events/summary"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com a lista de resumos", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events/summary

  Resumo dos próximos eventos publicados (cards da home).

  **Acesso:** público (sem token)

  **Respostas**

  - `200` array de resumos
