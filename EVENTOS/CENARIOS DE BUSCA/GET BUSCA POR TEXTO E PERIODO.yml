info:
  name: GET BUSCA POR TEXTO E PERIODO
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events?search=festa&startDate=2026-10-01&endDate=2026-12-31&page=1&limit=20"
  params:
    - name: search
      value: festa
      type: query
    - name: startDate
      value: 2026-10-01
      type: query
    - name: endDate
      value: 2026-12-31
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("termo aparece no nome ou na descrição", function () {
          expect(res.getStatus()).to.equal(200);
          res.getBody().data.forEach(function (event) {
            const text = (event.name + " " + (event.description || "")).toLowerCase();
            expect(text).to.include("festa");
          });
        });

        test("eventos se sobrepõem ao período pedido", function () {
          const start = new Date("2026-10-01T00:00:00-03:00");
          const end = new Date("2026-12-31T23:59:59.999-03:00");
          res.getBody().data.forEach(function (event) {
            expect(new Date(event.endDate) >= start).to.equal(true);
            expect(new Date(event.startDate) <= end).to.equal(true);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events

  `search` busca no nome ou na descrição (contém, sem diferenciar maiúsculas). Período: eventos que terminam a partir de `startDate` e começam até `endDate`. Data só com o dia vale no horário de Brasília (`endDate` até 23:59:59).

  **Acesso:** público (sem token)

  **Respostas**

  - `200` página de eventos
