info:
  name: GET LISTAR EVENTOS
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events?page=1&limit=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: search
      value: festa
      type: query
      disabled: true
    - name: category
      value: shows
      type: query
      disabled: true
    - name: city
      value: São Paulo
      type: query
      disabled: true
    - name: startDate
      value: 2026-12-01
      type: query
      disabled: true
    - name: endDate
      value: 2027-03-31
      type: query
      disabled: true
    - name: organizerId
      value: "{{organizerId}}"
      type: query
      disabled: true
    - name: venueId
      value: "{{venueId}}"
      type: query
      disabled: true
    - name: status
      value: published
      type: query
      disabled: true
    - name: featured
      value: "true"
      type: query
      disabled: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com a página de eventos", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().data).to.be.an("array");
          expect(res.getBody().meta).to.include.all.keys("page", "limit", "total", "totalPages");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events

  Lista paginada com busca e filtros. Os filtros ficam desativados na aba Params: marque os que quiser usar.

  **Acesso:** público (sem token); com token ADMIN vê todos os status

  **Query (todas opcionais)**
  - `search` — contém, no nome ou na descrição
  - `category`, `city` — valor exato, sem diferenciar maiúsculas
  - `startDate` / `endDate` — eventos que se sobrepõem ao período (só o dia vale no horário de Brasília)
  - `organizerId`, `venueId`, `status`, `featured`
  - `page` (padrão 1) e `limit` (padrão 20, máx. 100)

  Resposta: `{ data: [...], meta: { page, limit, total, totalPages } }`. Mais cenários em EVENTOS/CENARIOS DE BUSCA.

  **Respostas**

  - `200` página de eventos
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
