info:
  name: POST CRIAR EVENTO SEM PERMISSAO
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "name": "Evento sem permissão",
        "organizerId": "{{organizerId}}",
        "venueId": "{{venueId}}",
        "startDate": "2027-03-20T19:00:00.000Z",
        "endDate": "2027-03-21T02:00:00.000Z"
      }
  auth:
    type: bearer
    token: "{{tokenComprador}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 403 Forbidden", function () {
          expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Usuário comum (comprador, sem vínculo na organização) tenta criar um evento
  na organização {{organizerId}}. A API deve responder 403 Forbidden.
