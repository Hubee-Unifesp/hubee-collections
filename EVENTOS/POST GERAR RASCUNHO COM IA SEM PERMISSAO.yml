info:
  name: POST GERAR RASCUNHO COM IA SEM PERMISSAO
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/events/ai-draft"
  body:
    type: json
    data: |-
      {
        "prompt": "Show de rock no sábado às 20h."
      }
  auth:
    type: bearer
    token: "{{tokenComprador}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 403 Forbidden", function () {
          expect(res.getStatus()).to.equal(403);
        });

        test("mensagem explica que a rota é de organizadores", function () {
          expect(res.getBody().message).to.equal("Acesso restrito a organizadores de eventos");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # POST /events/ai-draft

  Usuário comum (comprador, sem organização) tenta gerar um rascunho de evento
  com IA. A API deve responder 403 Forbidden antes de chamar a IA, sem gastar a
  cota de gerações.

  **Acesso:** comprador sem organização (cenário de erro)

  **Respostas**

  - `403` usuário sem organização
