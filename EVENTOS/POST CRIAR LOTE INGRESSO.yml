info:
  name: POST CRIAR LOTE INGRESSO
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/events/:eventId/ticket-types"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "batch": "1º Lote Promocional",
        "price": 35.00,
        "quantity": 100
      }
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("ticketTypeId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("responde 201 Created com lote vinculado ao evento", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().eventId).to.equal(bru.getEnvVar("eventId"));
          expect(res.getBody().batch).to.equal("1º Lote Promocional");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Cria um lote de ingressos (ticket-type) no evento {{eventId}} e salva o ID em {{ticketTypeId}}.
  Protegido por @OrgAccess('write', { from: 'event', param: 'eventId' }) (GOL-206):
  - Exige vínculo aceito com nível write ou manage na organização do evento (ou ADMIN global).
  - Não-membros recebem 404 Not Found; membros read recebem 403 Forbidden.
