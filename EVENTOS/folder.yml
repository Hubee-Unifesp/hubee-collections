info:
  name: EVENTOS
  type: folder
  seq: 8

request:
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

docs:
  content: |-
    Eventos em `/events`. Listagem e detalhe são públicos (só `published` para quem
    não é ADMIN nem membro da organização); escrita exige permissão na organização
    `{{organizerId}}` (`{{tokenOrganizador}}`). O POST CRIAR EVENTO salva o id em
    `{{eventId}}`. A subpasta ASSISTENTE DE CRIACAO testa a conversa com IA que monta
    o rascunho do evento, sem salvar nada. Lotes ficam em LOTES DE INGRESSO; rode o
    DELETE CANCELAR EVENTO só no fim do fluxo.
  type: text/markdown
