info:
  name: PATCH ATUALIZAR EVENTO
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/events/:id"
  params:
    - name: id
      value: "{{eventId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Calourada Hubee — Edição Oficial",
        "description": "Evento atualizado e publicado pela coleção do Bruno (GOL-207).",
        "ageRating": "18",
        "edition": "2027.1",
        "status": "published"
      }
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 OK com dados atualizados", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("eventId"));
          expect(res.getBody().status).to.equal("published");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PATCH /events/:id

  Atualiza parcialmente ou publica o evento {{eventId}}.
  Protegido por @OrgAccess('write', { from: 'event', param: 'id' }):
  - Exige vínculo aceito com nível write ou manage na organização dona do evento (ou ADMIN global).
  - Não-membros recebem 404 Not Found; membros read recebem 403 Forbidden.
  - Eventos já cancelados respondem 422 Unprocessable Entity.

  **Acesso:** `ADMIN` ou membro com nível `write` na organização do evento

  **Campos**
  - `name` (string, até 255) — obrigatório no POST
  - `organizerId` (UUID da organização) — obrigatório no POST, não muda no PATCH
  - `venueId` (UUID do local) — obrigatório no POST
  - `startDate`, `endDate` (ISO 8601) — obrigatórios no POST
  - `salesStartDate` (ISO 8601) — opcional
  - `description`, `category`, `edition` (string) — opcionais
  - `ageRating`: `L` | `10` | `12` | `14` | `16` | `18`
  - `photoUrl` (URL) — opcional; para enviar arquivo use PATCH ENVIAR CAPA DO EVENTO
  - `featured` (boolean) — opcional
  - `status`: `draft` | `published` | `finished` | `cancelled` — só no PATCH (`cancelled` exige `manage`)

  **Respostas**

  - `200` evento atualizado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
  - `422` evento já cancelado
