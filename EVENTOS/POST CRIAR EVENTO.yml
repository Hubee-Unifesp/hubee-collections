info:
  name: POST CRIAR EVENTO
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "name": "Calourada Hubee",
        "description": "Evento criado pela coleção do Bruno (GOL-147).",
        "organizerId": "{{organizerId}}",
        "venueId": "{{venueId}}",
        "startDate": "2027-03-20T19:00:00.000Z",
        "endDate": "2027-03-21T02:00:00.000Z",
        "salesStartDate": "2027-02-01T12:00:00.000Z",
        "category": "Festa"
      }
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("eventId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("responde 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("evento pertence à organização do organizador", function () {
          expect(res.getBody().organizerId).to.equal(bru.getEnvVar("organizerId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # POST /events

  Organizador com nível write ou manage na organização {{organizerId}} cria um
  evento. O evento nasce como rascunho (draft).

  **Acesso:** `ADMIN` ou membro com nível `write` na organização de `organizerId`

  **Campos**
  - `name` (string, até 255) — obrigatório no POST
  - `organizerId` (UUID da organização) — obrigatório no POST, não muda no PATCH
  - `venueId` (UUID do local) — obrigatório no POST
  - `startDate`, `endDate` (ISO 8601) — obrigatórios no POST
  - `salesStartDate` (ISO 8601) — opcional
  - `description`, `category`, `edition` (string) — opcionais
  - `ageRating`: `L` | `10` | `12` | `14` | `16` | `18`
  - `photoUrl` (URL) — opcional; para enviar arquivo use PATCH ENVIAR CAPA DO EVENTO
  - `featured` (boolean) — opcional
  - `status`: `draft` | `published` | `finished` | `cancelled` — só no PATCH (`cancelled` exige `manage`)

  **Respostas**

  - `201` evento criado (`draft`)
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
