info:
  name: GET BUSCAR TAREFA
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId/tasks/:id"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
    - name: id
      value: "{{taskId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events/:eventId/tasks/:id

  Busca uma tarefa do evento.

  **Acesso:** somente `ADMIN` da plataforma

  **Respostas**

  - `200` tarefa
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
