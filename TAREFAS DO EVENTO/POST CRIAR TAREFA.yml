info:
  name: POST CRIAR TAREFA
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events/:eventId/tasks"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "responsibleUserId": "{{adminUserId}}",
        "title": "Contratar equipe de segurança",
        "description": "Mínimo de 20 seguranças para o público estimado.",
        "dueDate": "2027-03-05",
        "status": "pending"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("taskId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("responde 201 com a tarefa criada", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # POST /events/:eventId/tasks

  Cria uma tarefa no evento. Salva o id em `{{taskId}}`.

  **Acesso:** somente `ADMIN` da plataforma

  **Campos**
  - `responsibleUserId` (UUID) — obrigatório no POST
  - `title` (string, até 255) — obrigatório no POST
  - `description` (string) — opcional; `null` limpa no PATCH
  - `dueDate` (ISO 8601) — opcional; `null` limpa no PATCH
  - `status`: `pending` | `in_progress` | `done`

  **Respostas**

  - `201` tarefa criada
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
