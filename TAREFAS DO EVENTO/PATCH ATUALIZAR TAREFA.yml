info:
  name: PATCH ATUALIZAR TAREFA
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/events/:eventId/tasks/:id"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
    - name: id
      value: "{{taskId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "status": "in_progress",
        "dueDate": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # PATCH /events/:eventId/tasks/:id

  Atualização parcial da tarefa.

  **Acesso:** somente `ADMIN` da plataforma

  **Campos**
  - `responsibleUserId` (UUID) — obrigatório no POST
  - `title` (string, até 255) — obrigatório no POST
  - `description` (string) — opcional; `null` limpa no PATCH
  - `dueDate` (ISO 8601) — opcional; `null` limpa no PATCH
  - `status`: `pending` | `in_progress` | `done`

  **Respostas**

  - `200` tarefa atualizada
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
