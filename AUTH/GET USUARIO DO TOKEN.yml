info:
  name: GET USUARIO DO TOKEN
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("adminUserId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("responde 200 sem expor a senha", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.not.have.property("password");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /auth/me

  Retorna o usuário dono do token (aqui, o admin). Salva o id em `{{adminUserId}}`, usado como responsável nas tarefas.

  **Acesso:** autenticado (qualquer usuário logado)

  **Respostas**

  - `200` dados do usuário
  - `401` token ausente ou inválido
