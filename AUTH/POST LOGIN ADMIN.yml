info:
  name: POST LOGIN ADMIN
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailAdmin}}",
        "password": "{{senhaAdmin}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("tokenAdmin", res.getBody().access_token);
        }
    - type: tests
      code: |-
        test("responde 200 com access_token", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # POST /auth/login

  Login do usuário com role = `ADMIN` da plataforma. Salva o JWT em `{{tokenAdmin}}`.

  **Acesso:** público (sem token)

  No banco de seed, o admin é `admin@hubee.com.br` com a senha de `SEED_ADMIN_PASSWORD`.

  **Respostas**

  - `200` `{ access_token }`
  - `401` credenciais inválidas
