info:
  name: POST VINCULAR ORGANIZACAO
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events/:eventId/organizations"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "organizationId": "{{organizationId}}",
        "role": "co_organizer"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # POST /events/:eventId/organizations

  Vincula a organização `{{organizationId}}` ao evento com um papel.

  **Acesso:** somente `ADMIN` da plataforma

  **Campos**
  - `organizationId` (UUID) — obrigatório
  - `role`: `main` | `co_organizer` | `supporter` — obrigatório

  **Respostas**

  - `201` vínculo criado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
  - `409` organização já vinculada
