info:
  name: GET LISTAR ORGANIZACOES DO EVENTO
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId/organizations"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events/:eventId/organizations

  Lista as organizações vinculadas ao evento.

  **Acesso:** somente `ADMIN` da plataforma

  **Respostas**

  - `200` array de vínculos
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
