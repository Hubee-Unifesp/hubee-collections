info:
  name: GET ORGANIZACAO POR ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/organizations/:id"
  params:
    - name: id
      value: "{{organizationId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com os dados da organização", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("organizationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Consulta os detalhes da organização {{organizationId}} pelo seu UUID.
  Responde 200 OK com OrganizationResponseDto ou 404 Not Found caso não exista.
