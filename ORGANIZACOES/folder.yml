info:
  name: ORGANIZACOES
  type: folder
  seq: 5

request:
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

docs:
  content: |-
    CRUD de organizações e validação de RBAC em `/organizations` (GOL-197 / GOL-198).
    Qualquer usuário autenticado pode criar uma organização e passa a ter vínculo
    aceito como admin (nível `manage`). O POST CRIAR ORGANIZACAO salva o id em
    `{{organizationId}}`. A exclusão é só `ADMIN` (`{{tokenAdmin}}`).
  type: text/markdown
