info:
  name: POST FORNECEDOR
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/suppliers"
  body:
    type: json
    data: |-
      {
        "companyName": "Buffet Sabor Real",
        "cnpjCpf": "11222333000181",
        "phone": "11988887777",
        "email": "contato@saborreal.com.br",
        "category": "Buffet"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("supplierId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("responde 201 com o fornecedor criado", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().companyName).to.equal("Buffet Sabor Real");
          expect(res.getBody().deletedAt).to.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Organizador autenticado cadastra um fornecedor em /suppliers. Salva o id
  retornado em {{supplierId}} para uso nas requisições de detalhe, edição e
  exclusão. Se o CNPJ/CPF ou e-mail já estiver ativo, responde 409 Conflict.
