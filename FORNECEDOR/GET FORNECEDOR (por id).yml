info:
  name: GET FORNECEDOR (por id)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/suppliers/:id"
  params:
    - name: id
      value: "{{supplierId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com o fornecedor", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("supplierId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Detalha o fornecedor {{supplierId}} cadastrado pelo organizador.
