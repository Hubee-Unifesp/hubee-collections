info:
  name: GET BUSCAR LOTE
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId/ticket-types/:id"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
    - name: id
      value: "{{ticketTypeId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com o lote", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("ticketTypeId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events/:eventId/ticket-types/:id

  Busca um lote do evento, com o saldo `available`.

  **Acesso:** público (sem token) (evento publicado)

  **Respostas**

  - `200` lote
  - `404` recurso não encontrado
