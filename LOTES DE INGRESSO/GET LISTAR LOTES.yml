info:
  name: GET LISTAR LOTES
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId/ticket-types"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 OK com lista de lotes e saldo disponível", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET /events/:eventId/ticket-types

  Lista os lotes de ingressos do evento {{eventId}} ordenados por criação e preço,
  incluindo o saldo calculado em tempo real no campo `available`.
  Utiliza OptionalJwtAuthGuard: eventos em rascunho (draft) são visíveis apenas
  para membros da organização do evento ou ADMIN; eventos publicados são públicos.

  **Acesso:** público (sem token) (evento publicado)

  **Respostas**

  - `200` array de lotes com `available`
  - `404` recurso não encontrado
