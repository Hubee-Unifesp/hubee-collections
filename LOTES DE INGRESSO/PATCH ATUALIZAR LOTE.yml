info:
  name: PATCH ATUALIZAR LOTE
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/events/:eventId/ticket-types/:id"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
    - name: id
      value: "{{ticketTypeId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "batch": "1º Lote Oficial",
        "price": 45.00,
        "quantity": 150
      }
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 OK com lote atualizado", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("ticketTypeId"));
          expect(res.getBody().price).to.equal(45);
          expect(res.getBody().quantity).to.equal(150);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PATCH /events/:eventId/ticket-types/:id

  Atualiza parcialmente o lote {{ticketTypeId}} do evento {{eventId}}.
  Protegido por @OrgAccess('write', { from: 'event', param: 'eventId' }) (GOL-206).
  Responde 422 Unprocessable Entity caso a nova `quantity` seja menor que o total
  já comprometido por pedidos ativos (pending/paid) ou ingressos emitidos (GOL-212).

  **Acesso:** `ADMIN` ou membro com nível `write` na organização do evento

  **Campos**
  - `batch` (string, até 100) — nome do lote, obrigatório no POST
  - `price` (número, 2 casas, ≥ 0) — obrigatório no POST
  - `quantity` (inteiro ≥ 0, padrão 0) — ingressos à venda

  **Respostas**

  - `200` lote atualizado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
  - `422` `quantity` menor que o já vendido/reservado
