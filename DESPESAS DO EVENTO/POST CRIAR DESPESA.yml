info:
  name: POST CRIAR DESPESA
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/events/:eventId/expenses"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "supplierId": "{{supplierId}}",
        "description": "Buffet para 500 pessoas",
        "amount": 15000,
        "costType": "Alimentação",
        "dueDate": "2027-03-10",
        "paymentStatus": "pendente"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("expenseId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("responde 201 com a despesa criada", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # POST /events/:eventId/expenses

  Lança uma despesa no evento. Salva o id em `{{expenseId}}`.

  **Acesso:** somente `ADMIN` da plataforma

  **Campos** (todos editáveis no PATCH)
  - `supplierId` (UUID) — obrigatório no POST
  - `description` (string, 1–500) — obrigatório no POST
  - `amount` (número, 2 casas, ≥ 0) — obrigatório no POST
  - `costType` (string, 1–100) — obrigatório no POST
  - `dueDate` (ISO 8601) — obrigatório no POST
  - `paymentStatus`: `pendente` | `pago` | `atrasado` | `cancelado`

  **Respostas**

  - `201` despesa criada
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
