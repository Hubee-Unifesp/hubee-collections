info:
  name: GET BUSCAR DESPESA
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId/expenses/:id"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
    - name: id
      value: "{{expenseId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events/:eventId/expenses/:id

  Busca uma despesa do evento.

  **Acesso:** somente `ADMIN` da plataforma

  **Respostas**

  - `200` despesa
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
