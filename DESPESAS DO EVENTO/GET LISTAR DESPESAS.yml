info:
  name: GET LISTAR DESPESAS
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events/:eventId/expenses"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: path
    - name: paymentStatus
      value: pendente
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /events/:eventId/expenses

  Lista as despesas do evento, com filtro opcional por `paymentStatus`.

  **Acesso:** somente `ADMIN` da plataforma

  **Respostas**

  - `200` array de despesas
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
