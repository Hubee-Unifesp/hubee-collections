info:
  name: PATCH ATUALIZAR STATUS DO INGRESSO
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/tickets/:id"
  params:
    - name: id
      value: "{{ticketId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "status": "usado"
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # PATCH /tickets/:id

  Muda o status do ingresso (ex.: marcar como usado na portaria). Só `status` muda depois da emissão.

  **Acesso:** somente `ADMIN` da plataforma

  `status`: `emitido` | `usado` | `cancelado` — obrigatório.

  **Respostas**

  - `200` ingresso atualizado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
