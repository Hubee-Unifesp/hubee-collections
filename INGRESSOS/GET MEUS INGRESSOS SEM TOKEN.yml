info:
  name: GET MEUS INGRESSOS SEM TOKEN
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/tickets"

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 401 sem token", function () {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET /tickets

  A listagem de ingressos exige login.

  **Acesso:** sem token (cenário de erro)

  **Respostas**

  - `401` token ausente ou inválido
