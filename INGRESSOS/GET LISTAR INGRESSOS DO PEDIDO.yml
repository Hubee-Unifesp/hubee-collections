info:
  name: GET LISTAR INGRESSOS DO PEDIDO
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/orders/:orderId/tickets"
  params:
    - name: orderId
      value: "{{orderId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com 2 ingressos emitidos do pedido", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.have.length(2);
          res.getBody().forEach(function (ticket) {
            expect(ticket.orderId).to.equal(bru.getEnvVar("orderId"));
            expect(ticket.status).to.equal("emitido");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET /orders/:orderId/tickets

  Ingressos do pedido {{orderId}}: um por unidade comprada.

  **Acesso:** autenticado (qualquer usuário logado); comprador ou `ADMIN`

  **Respostas**

  - `200` array de ingressos
  - `401` token ausente ou inválido
  - `404` recurso não encontrado
