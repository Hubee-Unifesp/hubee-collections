info:
  name: GET INGRESSO POR ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/tickets/{{ticketId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com o ingresso", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("ticketId"));
          expect(res.getBody().qrCode).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Consulta o ingresso salvo em {{ticketId}}. Ingresso de outra pessoa responde 404.
