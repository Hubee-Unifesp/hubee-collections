info:
  name: GET MEUS INGRESSOS (users me)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/me/tickets"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com a mesma lista de GET /tickets", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array").that.is.not.empty;
          expect(res.getBody()[0]).to.include.keys("qrCode", "event", "ticketType");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Alias de GET /tickets sob o perfil do usuário.
