info:
  name: POST EMITIR INGRESSOS
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/orders/:orderId/tickets"
  params:
    - name: orderId
      value: "{{orderId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "tickets": [
          {
            "eventId": "{{eventId}}",
            "ticketTypeId": "{{ticketTypeId}}"
          },
          {
            "eventId": "{{eventId}}",
            "ticketTypeId": "{{ticketTypeId}}",
            "holderUserId": "{{userId}}"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # POST /orders/:orderId/tickets

  Emite ingressos de um pedido pago, à mão. No fluxo normal o checkout já emite.

  **Acesso:** somente `ADMIN` da plataforma

  **Campos**
  - `tickets[]` (1–100) — obrigatório
    - `eventId` (UUID)
    - `ticketTypeId` (UUID de lote do pedido)
    - `holderUserId` (UUID) — opcional; sem ele o titular é o comprador

  **Respostas**

  - `201` array de ingressos
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
  - `422` pedido não pago, evento cancelado, lote fora do pedido ou sem vagas
