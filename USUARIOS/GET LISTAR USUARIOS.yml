info:
  name: GET LISTAR USUARIOS
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com a lista de usuários", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /users

  Lista todos os usuários ativos.

  **Acesso:** somente `ADMIN` da plataforma

  **Respostas**

  - `200` array de usuários
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
