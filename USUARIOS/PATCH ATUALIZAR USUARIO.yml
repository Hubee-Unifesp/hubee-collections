info:
  name: PATCH ATUALIZAR USUARIO
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/users/:id"
  params:
    - name: id
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "fullName": "João da Silva Santos",
        "phone": "11912345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # PATCH /users/:id

  Atualização parcial: envie só os campos que mudam.

  **Acesso:** somente `ADMIN` da plataforma

  **Campos**
  - `fullName` (string, 1–200) — obrigatório no POST
  - `email` (e-mail único) — obrigatório no POST
  - `password` (6–20 caracteres) — obrigatório no POST
  - `phone` (só números) — opcional
  - `cpf` (CPF válido, único) — opcional
  - `birthDate` (data ISO, não futura) — opcional
  - `signupIntent` (`BUY` | `ORGANIZE`) — opcional

  **Respostas**

  - `200` usuário atualizado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
