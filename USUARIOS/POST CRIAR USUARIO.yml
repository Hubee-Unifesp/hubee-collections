info:
  name: POST CRIAR USUARIO
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: |-
      {
        "fullName": "João da Silva",
        "email": "{{$randomEmail}}",
        "phone": "11987654321",
        "password": "Senha123!",
        "birthDate": "1995-04-20",
        "signupIntent": "BUY"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("userId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("responde 201 com o usuário criado", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # POST /users

  Cria um usuário. Salva o id em `{{userId}}`, usado em MEMBROS DA ORGANIZACAO e INGRESSOS.

  **Acesso:** somente `ADMIN` da plataforma

  **Campos**
  - `fullName` (string, 1–200) — obrigatório no POST
  - `email` (e-mail único) — obrigatório no POST
  - `password` (6–20 caracteres) — obrigatório no POST
  - `phone` (só números) — opcional
  - `cpf` (CPF válido, único) — opcional
  - `birthDate` (data ISO, não futura) — opcional
  - `signupIntent` (`BUY` | `ORGANIZE`) — opcional

  **Respostas**

  - `201` usuário criado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `409` e-mail ou CPF já cadastrado
