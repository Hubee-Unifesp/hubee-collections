info:
  name: GET BUSCAR LOCAL
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/venues/:id"
  params:
    - name: id
      value: "{{venueId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /venues/:id

  Busca um local pelo id, com o endereço.

  **Acesso:** público (sem token)

  **Respostas**

  - `200` local com endereço
  - `404` recurso não encontrado
