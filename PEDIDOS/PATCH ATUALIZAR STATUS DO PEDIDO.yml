info:
  name: PATCH ATUALIZAR STATUS DO PEDIDO
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/orders/:id"
  params:
    - name: id
      value: "{{orderToCancelId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "status": "cancelado"
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # PATCH /orders/:id

  Muda o status do pedido. Só `status` é aceito (total e comprador não mudam).

  **Acesso:** somente `ADMIN` da plataforma

  `status`: `pendente` | `pago` | `cancelado`. As transições válidas são regra do `OrderService`: marcar como pago é feito pelo checkout (PAGAMENTOS/POST PAGAR PEDIDO). Rodado depois do DELETE CANCELAR PEDIDO, responde 422 (pedido já cancelado).

  **Respostas**

  - `200` pedido atualizado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
  - `422` transição de status inválida
