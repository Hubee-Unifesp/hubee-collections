info:
  name: PEDIDOS
  type: folder
  seq: 11

request:
  auth:
    type: bearer
    token: "{{tokenComprador}}"

docs:
  content: |-
    Pedidos em `/orders` (GOL-175), com o token do comprador (`{{tokenComprador}}`).
    Preencha `ticketTypeId` (lote com saldo) e `soldOutTicketTypeId` (lote esgotado)
    no ambiente; o comprador precisa ter CPF e data de nascimento no perfil. O total
    é calculado pelo servidor. Listar todos e mudar status são só `ADMIN`. O
    pagamento fica na pasta PAGAMENTOS.
  type: text/markdown
