info:
  name: GET LISTAR PEDIDOS
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/orders"
  params:
    - name: userId
      value: "{{userId}}"
      type: query
      disabled: true
    - name: status
      value: pago
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  # GET /orders

  Lista todos os pedidos da plataforma, com filtros opcionais.

  **Acesso:** somente `ADMIN` da plataforma

  Filtros: `userId` (UUID) e `status` (`pendente` | `pago` | `cancelado`). Para os pedidos do próprio usuário use GET MEUS PEDIDOS.

  **Respostas**

  - `200` array de pedidos
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
