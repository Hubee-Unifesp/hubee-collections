info:
  name: GET MEUS PEDIDOS
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/users/me/orders"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 só com pedidos do próprio comprador", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
          const ids = res.getBody().map(function (order) { return order.id; });
          expect(ids).to.include(bru.getEnvVar("orderId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lista os pedidos do comprador logado. Aceita o filtro opcional ?status=pendente.
