info:
  name: GET MEUS PEDIDOS
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/users/me/orders"
  params:
    - name: status
      value: pendente
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 só com pedidos do próprio comprador", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
          const ids = res.getBody().map(function (order) { return order.id; });
          expect(ids).to.include(bru.getEnvVar("orderId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET /users/me/orders

  Lista os pedidos do comprador logado. Aceita o filtro opcional ?status=pendente.

  **Acesso:** autenticado (qualquer usuário logado)

  **Respostas**

  - `200` array de pedidos do usuário
  - `401` token ausente ou inválido
