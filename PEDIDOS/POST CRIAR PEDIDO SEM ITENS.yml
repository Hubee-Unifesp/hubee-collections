info:
  name: POST CRIAR PEDIDO SEM ITENS
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/orders"
  body:
    type: json
    data: |-
      {
        "items": []
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 400 pedindo ao menos um item", function () {
          expect(res.getStatus()).to.equal(400);
          expect(JSON.stringify(res.getBody().message)).to.include("ao menos um item");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  A validação do corpo recusa um pedido sem itens.
