info:
  name: GET BUSCAR FORNECEDOR
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/suppliers/:id"
  params:
    - name: id
      value: "{{supplierId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com o fornecedor", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getEnvVar("supplierId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # GET /suppliers/:id

  Detalha o fornecedor {{supplierId}} cadastrado pelo organizador.

  **Acesso:** organizador (vínculo aceito em alguma organização) ou `ADMIN`

  **Respostas**

  - `200` fornecedor
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
