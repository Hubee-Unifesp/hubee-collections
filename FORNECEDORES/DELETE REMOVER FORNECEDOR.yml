info:
  name: DELETE REMOVER FORNECEDOR
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/suppliers/:id"
  params:
    - name: id
      value: "{{supplierId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 204 No Content", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # DELETE /suppliers/:id

  Remove logicamente (deleted_at) o fornecedor {{supplierId}}.

  **Acesso:** organizador (vínculo aceito em alguma organização) ou `ADMIN`

  Rode depois de DESPESAS DO EVENTO, que usa `{{supplierId}}`.

  **Respostas**

  - `204` removido
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
