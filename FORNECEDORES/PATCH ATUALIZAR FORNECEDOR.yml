info:
  name: PATCH ATUALIZAR FORNECEDOR
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/suppliers/:id"
  params:
    - name: id
      value: "{{supplierId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "companyName": "Buffet Sabor Real Premium",
        "phone": "11977776666"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com os dados atualizados", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().companyName).to.equal("Buffet Sabor Real Premium");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PATCH /suppliers/:id

  Atualiza os dados cadastrais do fornecedor {{supplierId}}.

  **Acesso:** organizador (vínculo aceito em alguma organização) ou `ADMIN`

  **Campos**
  - `companyName` (string) — obrigatório no POST
  - `cnpjCpf` (só números, 11–14 dígitos) — obrigatório no POST
  - `phone`, `category` (string) — opcionais
  - `email` (e-mail) — opcional

  **Respostas**

  - `200` fornecedor atualizado
  - `400` body ou parâmetros inválidos (mensagens em `message[]`)
  - `401` token ausente ou inválido
  - `403` perfil sem permissão
  - `404` recurso não encontrado
  - `409` CNPJ/CPF ou e-mail já em uso
