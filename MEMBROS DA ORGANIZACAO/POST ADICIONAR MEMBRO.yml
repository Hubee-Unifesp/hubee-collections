info:
  name: POST ADICIONAR MEMBRO
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/organizations/:orgId/users"
  params:
    - name: orgId
      value: "{{organizationId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "email": "{{emailComprador}}",
        "role": "member",
        "permission": "read_only"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("userId", res.getBody().userId);
        }
    - type: tests
      code: |-
        test("responde 201 com o convite pendente criado", function () {
          expect(res.getStatus()).to.equal(201);
          const body = res.getBody();
          expect(body.orgId).to.equal(bru.getEnvVar("organizationId"));
          expect(body.userId).to.be.a("string");
          expect(body.userName).to.be.a("string");
          expect(body.userEmail).to.be.a("string");
          expect(body.role).to.equal("member");
          expect(body.permission).to.equal("read_only");
          expect(body.inviteStatus).to.equal("pending");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # POST /organizations/:orgId/users

  Convida um usuário ativo para a organização `{{organizationId}}` informando o
  e-mail (`CreateOrganizationUserDto`). O vínculo é criado sempre com
  `inviteStatus = "pending"` e o `userId` retornado é salvo em `{{userId}}`.

  **Acesso:** `@OrgAccess('manage', { from: 'org', param: 'orgId' })` — administrador da organização (nível `manage`) ou `ADMIN` global.

  **Campos (`CreateOrganizationUserDto`)**
  - `email` (string, e-mail de usuário ativo) — obrigatório
  - `role`: `admin` | `member` — obrigatório
  - `permission`: `full` | `read_only` — obrigatório

  **Respostas**

  - `201` convite criado (`OrganizationUserResponseDto`, com `userName`, `userEmail` e `inviteStatus: "pending"`)
  - `400` body ou parâmetros inválidos (e-mail inválido ou `orgId` não UUID)
  - `401` token ausente ou inválido
  - `403` membro da organização com nível `read` ou `write` (sem `manage`)
  - `404` organização inexistente, usuário solicitante sem vínculo aceito na organização, ou e-mail não pertence a nenhum usuário ativo
  - `409` usuário já vinculado a esta organização
