info:
  name: MEMBROS DA ORGANIZACAO
  type: folder
  seq: 6

request:
  auth:
    type: bearer
    token: "{{tokenOrganizador}}"

docs:
  content: |-
    Gerenciamento de membros e convites da organização (GOL-275).
    As rotas de gestão (`/organizations/:orgId/users` e `/organizations/:orgId/users/:userId`)
    são protegidas por `@OrgAccess('manage', { from: 'org', param: 'orgId' })` e herdam
    `{{tokenOrganizador}}` (ou `ADMIN` global).
    As rotas do usuário convidado (`GET /users/me/invites` e `PATCH /organizations/:orgId/users/me`)
    são protegidas por `@Authenticated()` e utilizam `{{tokenComprador}}`.
    Usa `{{organizationId}}`, `{{emailComprador}}` e `{{userId}}`.
  type: text/markdown
