info:
  name: DELETE REMOVER MEMBRO
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/organizations/:orgId/users/:userId"
  params:
    - name: orgId
      value: "{{organizationId}}"
      type: path
    - name: userId
      value: "{{userId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 204 No Content", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # DELETE /organizations/:orgId/users/:userId

  Desvincula o usuário `{{userId}}` da organização `{{organizationId}}`.

  **Acesso:** `@OrgAccess('manage', { from: 'org', param: 'orgId' })` — administrador da organização (nível `manage`) ou `ADMIN` global.

  **Respostas**

  - `204` vínculo removido com sucesso (sem corpo de resposta)
  - `400` `orgId` ou `userId` não é um UUID válido
  - `401` token ausente ou inválido
  - `403` membro da organização com nível `read` ou `write` (sem `manage`)
  - `404` organização/vínculo não encontrado ou usuário solicitante sem vínculo aceito na organização
