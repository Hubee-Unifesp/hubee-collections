info:
  name: PATCH ATUALIZAR MEMBRO
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/organizations/:orgId/users/:userId"
  params:
    - name: orgId
      value: "{{organizationId}}"
      type: path
    - name: userId
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "role": "admin",
        "permission": "full"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 200 com papel e permissão atualizados", function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body.role).to.equal("admin");
          expect(body.permission).to.equal("full");
          expect(body.userName).to.be.a("string");
          expect(body.userEmail).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # PATCH /organizations/:orgId/users/:userId

  Atualiza papel, permissão ou status de convite de um membro da organização `{{organizationId}}`.

  **Acesso:** `@OrgAccess('manage', { from: 'org', param: 'orgId' })` — administrador da organização (nível `manage`) ou `ADMIN` global.

  **Campos (`UpdateOrganizationUserDto` — ao menos um obrigatório)**
  - `role`: `admin` | `member` — opcional
  - `permission`: `full` | `read_only` — opcional
  - `inviteStatus`: `pending` | `accepted` | `rejected` — opcional

  **Respostas**

  - `200` vínculo atualizado (`OrganizationUserResponseDto`, com `userName` e `userEmail`)
  - `400` body vazio, campos inválidos ou UUID inválido
  - `401` token ausente ou inválido
  - `403` membro da organização com nível `read` ou `write` (sem `manage`)
  - `404` organização/vínculo não encontrado ou usuário solicitante sem vínculo aceito na organização
